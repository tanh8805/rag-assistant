services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: rag   
      POSTGRES_DB: postgres  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/01-parent-child.sql:ro
      - ./src/db/init_1.sql:/docker-entrypoint-initdb.d/02-flat.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: rag-api
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
